<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CORS manual test (not CI)</title>
  </head>
  <body>
    <h1>CORS manual test</h1>
    <p>Open from FRONTEND_ORIGIN and call backend /api/health.</p>
    <pre id="out">Running…</pre>
    <script>
      const backend =
        new URLSearchParams(location.search).get("backend") || "http://127.0.0.1:3001";
      fetch(backend + "/api/health", { credentials: "include" })
        .then((r) => r.json())
        .then((j) => (document.getElementById("out").textContent = JSON.stringify(j, null, 2)))
        .catch((e) => (document.getElementById("out").textContent = String(e)));
    </script>
  </body>
</html>
